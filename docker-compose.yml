# ─── GPXtooth en PRODUCTION (VPS) ────────────────────────────────────────────
# Déployer : docker --context vps compose up -d --build
# En local, utiliser docker-compose.local.yml (ou node dev.js sans Docker).

version: '3.8'

services:
  gpxtooth:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gpxtooth-web

    ports:
      - "127.0.0.1:8081:80"

    depends_on:
      - api

    restart: unless-stopped

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  # API Node : connexion du propriétaire + traces sur le serveur.
  # Aucun port exposé : accessible uniquement via nginx (/api/).
  api:
    build:
      context: ./server
    container_name: gpxtooth-api

    env_file: .env

    volumes:
      - gpxtooth-data:/data

    restart: unless-stopped

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  gpxtooth-data:
